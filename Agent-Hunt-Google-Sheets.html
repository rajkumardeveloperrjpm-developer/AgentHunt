<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Hunt | Review Portal</title>
<style>
:root{--bg:#080a0c;--p:#11171b;--p2:#0d1215;--l:#303a40;--t:#f7f7f4;--m:#a9b2b7;--o:#ff7a22;--g:#9de66f;--r:#ff7166;--b:#7fc7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 5%,#ff7a2218,transparent 28%),linear-gradient(135deg,#06080a,#0d1216 55%,#06080a);color:var(--t);font:14px Inter,system-ui,Arial;min-height:100vh}body:before{content:"";position:fixed;inset:0;opacity:.08;pointer-events:none;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:34px 34px}.wrap{max-width:1240px;margin:auto;padding:22px}.card{background:#11171bf2;border:1px solid var(--l);border-radius:17px;padding:20px;box-shadow:0 18px 50px #0006}.login{max-width:460px;margin:12vh auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:12px;background:var(--o);display:grid;place-items:center;color:#111;font-weight:1000;font-size:20px}.ey{font-size:11px;color:var(--o);font-weight:900;letter-spacing:.13em;text-transform:uppercase}.muted{color:var(--m)}h1,h2,h3{margin:6px 0 10px}h1{font-size:28px}h2{font-size:21px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}}.stat{padding:18px;border:1px solid var(--l);border-radius:14px;background:#0c1114}.stat b{font-size:28px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:1px solid var(--l);background:#171f24;color:var(--t);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800}.btn:hover{border-color:#66737a}.primary{background:var(--o);border-color:var(--o);color:#111}.danger{border-color:#6d2b27;color:#ff9a90}.good{color:var(--g)}.tag{display:inline-block;padding:5px 9px;border:1px solid var(--l);border-radius:999px;color:var(--m);font-size:12px}.hide{display:none!important}input,select,textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--l);background:#090d10;color:var(--t);outline:none}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--m);display:block;margin:0 0 6px}.field{margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #263035;vertical-align:top}th{color:#cdd4d7;font-size:12px}td{color:#f2f3f1}.scroll{overflow:auto}.notice{padding:11px 13px;border-radius:10px;background:#161d21;border:1px solid var(--l);margin:10px 0}.err{color:#ff9a90}.success{color:#b7ef94}.score{font-size:24px;font-weight:1000;color:var(--o)}.criteria{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav .btn.active{border-color:var(--o);color:var(--o)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.small{font-size:12px}.empty{padding:35px;text-align:center;color:var(--m)}.bar{height:8px;background:#20282c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}.public{min-height:100vh}.hero{padding:26px;border:1px solid var(--l);border-radius:18px;background:linear-gradient(135deg,#141b1f,#0b0f12)}
</style></head><body><div id="app"></div>
<script>
const CONFIG={API_URL:"https://script.google.com/macros/s/AKfycby0h2Hv3P8AKoPF_MjEJIc3tbcvUMoTztiSWELrrpxpl3OSIjtaIuh_fAKekEbnWkZ8MA/exec"};
const CRITERIA=[['Problem Relevance',25,'Is this a real Ancestry problem? Is it clearly articulated?'],['Agent Solution',20,'Is KIRO Agent the right approach? Is it well designed?'],['Innovation',20,'Is this creative? Does it go beyond basic automation?'],['Expected Impact',20,'How significant is the saving? Is it quantified?'],['Demo Quality',15,'How clearly is it presented and demonstrated?']];
let session=JSON.parse(sessionStorage.getItem('ah_session')||'null');
let state={page:'login',data:null};
const $=s=>document.querySelector(s); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){if(!CONFIG.API_URL||CONFIG.API_URL.includes('PASTE_'))throw Error('Set CONFIG.API_URL to your deployed Google Apps Script Web App URL.'); const body=new URLSearchParams({action,...payload}); if(session?.token) body.set('token',session.token); const r=await fetch(CONFIG.API_URL,{method:'POST',body}); const j=await r.json(); if(!j.ok)throw Error(j.error||'Request failed'); return j;}
function msg(t,cls='notice'){return `<div class="${cls}">${esc(t)}</div>`}
function shell(title,sub,body){return `<div class="wrap"><div class="top"><div class="brand"><div class="logo">AH</div><div><div class="ey">Agent Hunt</div><h1>${esc(title)}</h1><div class="muted">${esc(sub||'')}</div></div></div><button class="btn" onclick="logout()">Logout</button></div>${body}</div>`}
function login(){state.page='login';document.getElementById('app').innerHTML=`<div class="wrap"><div class="card login"><div class="brand"><div class="logo">AH</div><div><div class="ey">Agent Hunt</div><h1>Review Portal</h1><div class="muted">Google Sheets database edition</div></div></div><div style="height:18px"></div><div class="field"><label>Username / Email</label><input id="u" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button><div id="loginmsg"></div><div class="notice small" style="margin-top:16px">Public dashboard: <a href="?public=1" style="color:var(--o)">open without login</a></div></div></div>`}
async function doLogin(){const m=$('#loginmsg');m.innerHTML=msg('Signing in…');try{const r=await api('login',{username:$('#u').value.trim(),password:$('#p').value});session={token:r.token,user:r.user,role:r.role};sessionStorage.setItem('ah_session',JSON.stringify(session));await load();}catch(e){m.innerHTML=msg(e.message,'err')}}
function logout(){session=null;sessionStorage.removeItem('ah_session');login()}
async function load(){try{const r=await api('bootstrap');state.data=r.data;render()}catch(e){session=null;sessionStorage.removeItem('ah_session');login();$('#loginmsg')?.replaceChildren(document.createTextNode(e.message))}}
function nav(active){return `<div class="nav">${(session.role==='admin'?['overview','ideas','judges','allocations','results']:['overview','reviews']).map(x=>`<button class="btn ${active===x?'active':''}" onclick="page('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`}
function render(){const d=state.data;if(!d)return login();if(session.role==='admin')renderAdmin();else renderJudge()}
function renderAdmin(){const d=state.data;document.getElementById('app').innerHTML=shell('Admin Dashboard','Manage ideas, judges, allocations and consolidated results.',nav(state.page)+adminPage())}
function adminPage(){const d=state.data; if(state.page==='ideas')return adminIdeas(d);if(state.page==='judges')return adminJudges(d);if(state.page==='allocations')return adminAlloc(d);if(state.page==='results')return adminResults(d);return adminOverview(d)}
function adminOverview(d){const avg=d.results.length?Math.round(d.results.reduce((a,x)=>a+Number(x.total||0),0)/d.results.length):0;return `<div class="grid g4"><div class="stat"><div class="muted">Ideas</div><b>${d.ideas.length}</b></div><div class="stat"><div class="muted">Judges</div><b>${d.judges.length}</b></div><div class="stat"><div class="muted">Reviews</div><b>${d.results.length}</b></div><div class="stat"><div class="muted">Average Score</div><b>${avg}</b><span class="muted">/100</span></div></div><div style="height:16px"></div><div class="card"><h2>Agent Hunt Review Setup</h2><p class="muted">25 Sep 2026 — phase-1 review &nbsp;•&nbsp; 30 Sep & 1 Oct 2026 — POC submission/demo</p><div class="grid g3"><div><span class="tag">Problem Relevance /25</span></div><div><span class="tag">Agent Solution /20</span></div><div><span class="tag">Innovation /20</span></div><div><span class="tag">Expected Impact /20</span></div><div><span class="tag">Demo Quality /15</span></div></div></div>`}
function adminIdeas(d){return `<div class="card"><div class="row"><div><h2>Ideas</h2><div class="muted">Create and manage challenge entries.</div></div><button class="btn primary" onclick="ideaForm()">+ Add Idea</button></div><div class="scroll" style="margin-top:12px"><table><tr><th>ID</th><th>Idea / Team</th><th>Leader</th><th>Impact</th><th>Status</th><th></th></tr>${d.ideas.map(i=>`<tr><td>${esc(i.id)}</td><td><b>${esc(i.idea)}</b><br><span class="muted">${esc(i.team)}</span></td><td>${esc(i.leader)}</td><td>${esc(i.impact)}</td><td>${esc(i.status||'')}</td><td><button class="btn small" onclick='ideaForm(${JSON.stringify(i)})'>Edit</button> <button class="btn danger small" onclick="removeIdea('${esc(i.id)}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function ideaForm(i={}){const edit=!!i.id;document.getElementById('app').innerHTML=shell(edit?'Edit Idea':'Add Idea','Idea information is stored in Google Sheets.',nav('ideas')+`<div class="card"><div class="grid g2"><div class="field"><label>Idea ID</label><input id="f_id" value="${esc(i.id||'')}" ${edit?'readonly':''}></div><div class="field"><label>Idea Name</label><input id="f_idea" value="${esc(i.idea||'')}"></div><div class="field"><label>Team Name</label><input id="f_team" value="${esc(i.team||'')}"></div><div class="field"><label>Team Leader</label><input id="f_leader" value="${esc(i.leader||'')}"></div><div class="field"><label>Participant 1</label><input id="f_p1" value="${esc(i.p1||'')}"></div><div class="field"><label>Participant 2</label><input id="f_p2" value="${esc(i.p2||'')}"></div><div class="field"><label>Business Impact / Saving</label><input id="f_impact" value="${esc(i.impact||'')}"></div><div class="field"><label>Status</label><input id="f_status" value="${esc(i.status||'')}" placeholder="Not started / In progress / Ready"></div></div><div class="field"><label>Description</label><textarea id="f_desc">${esc(i.description||'')}</textarea></div><div class="field"><label>Proposed Solution</label><textarea id="f_solution">${esc(i.solution||'')}</textarea></div><div class="field"><label>POC / Admin Notes</label><textarea id="f_notes">${esc(i.notes||'')}</textarea></div><button class="btn primary" onclick="saveIdea(${edit})">Save Idea</button> <button class="btn" onclick="page('ideas')">Cancel</button><div id="formmsg"></div></div>`)}
async function saveIdea(edit){const p={id:$('#f_id').value.trim(),idea:$('#f_idea').value.trim(),team:$('#f_team').value.trim(),leader:$('#f_leader').value.trim(),p1:$('#f_p1').value.trim(),p2:$('#f_p2').value.trim(),impact:$('#f_impact').value.trim(),status:$('#f_status').value.trim(),description:$('#f_desc').value,solution:$('#f_solution').value,notes:$('#f_notes').value};try{await api(edit?'updateIdea':'addIdea',p);await load();page('ideas')}catch(e){$('#formmsg').innerHTML=msg(e.message,'err')}}
async function removeIdea(id){if(!confirm('Delete this idea and its allocations/evaluations?'))return;try{await api('deleteIdea',{id});await load();page('ideas')}catch(e){alert(e.message)}}
function adminJudges(d){return `<div class="card"><div class="row"><div><h2>Judges</h2><div class="muted">Judge accounts are stored as password hashes in the sheet.</div></div><button class="btn primary" onclick="judgeForm()">+ Add Judge</button></div><div class="scroll" style="margin-top:12px"><table><tr><th>Name</th><th>Username / Email</th><th>Active</th><th></th></tr>${d.judges.map(j=>`<tr><td>${esc(j.name)}</td><td>${esc(j.user)}</td><td>${j.active?'Yes':'No'}</td><td><button class="btn small" onclick="toggleJudge('${esc(j.user)}')">${j.active?'Disable':'Enable'}</button> <button class="btn danger small" onclick="removeJudge('${esc(j.user)}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function judgeForm(){document.getElementById('app').innerHTML=shell('Add Judge','Create a judge account.',nav('judges')+`<div class="card"><div class="grid g2"><div class="field"><label>Name</label><input id="j_name"></div><div class="field"><label>Username / Email</label><input id="j_user"></div><div class="field"><label>Password</label><input id="j_pass" type="password"></div></div><button class="btn primary" onclick="saveJudge()">Create Judge</button> <button class="btn" onclick="page('judges')">Cancel</button><div id="jmsg"></div></div>`)}
async function saveJudge(){try{await api('addJudge',{name:$('#j_name').value.trim(),user:$('#j_user').value.trim(),password:$('#j_pass').value});await load();page('judges')}catch(e){$('#jmsg').innerHTML=msg(e.message,'err')}}
async function toggleJudge(user){try{await api('toggleJudge',{user});await load();page('judges')}catch(e){alert(e.message)}}async function removeJudge(user){if(!confirm('Delete this judge?'))return;try{await api('deleteJudge',{user});await load();page('judges')}catch(e){alert(e.message)}}
function adminAlloc(d){return `<div class="card"><h2>Judge Allocation</h2><div class="muted">A judge only receives ideas explicitly allocated to them.</div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Judge</label><select id="a_j">${d.judges.filter(j=>j.active).map(j=>`<option value="${esc(j.user)}">${esc(j.name)} — ${esc(j.user)}</option>`).join('')}</select></div><div class="field"><label>Idea</label><select id="a_i">${d.ideas.map(i=>`<option value="${esc(i.id)}">${esc(i.id)} — ${esc(i.team)} — ${esc(i.idea)}</option>`).join('')}</select></div></div><button class="btn primary" onclick="allocate()">Allocate</button><div id="amsg"></div><div class="scroll" style="margin-top:18px"><table><tr><th>Judge</th><th>Idea</th><th></th></tr>${d.allocations.map(a=>`<tr><td>${esc(a.judge)}</td><td>${esc(a.idea)}</td><td><button class="btn danger small" onclick="deallocate('${esc(a.judge)}','${esc(a.idea)}')">Remove</button></td></tr>`).join('')}</table></div></div>`}
async function allocate(){try{await api('allocate',{judge:$('#a_j').value,idea:$('#a_i').value});await load();page('allocations')}catch(e){$('#amsg').innerHTML=msg(e.message,'err')}}async function deallocate(j,i){try{await api('deallocate',{judge:j,idea:i});await load();page('allocations')}catch(e){alert(e.message)}}
function adminResults(d){return `<div class="card"><div class="row"><div><h2>Consolidated Results</h2><div class="muted">All judge evaluations.</div></div><button class="btn primary" onclick="downloadResults()">Download CSV</button></div><div class="scroll" style="margin-top:12px"><table><tr><th>Idea</th><th>Team</th><th>Judge</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th><th>Total</th><th>Edits</th><th>Comments</th><th></th></tr>${d.results.map(x=>`<tr><td>${esc(x.idea)}</td><td>${esc(x.team)}</td><td>${esc(x.judge)}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.p3}</td><td>${x.p4}</td><td>${x.p5}</td><td class="score">${x.total}</td><td>${x.edits||0}</td><td>${esc(x.comments)}</td><td><button class="btn danger small" onclick="deleteEval('${esc(x.idea)}','${esc(x.judge)}')">Remove</button></td></tr>`).join('')}</table></div></div>`}
async function deleteEval(idea,judge){if(!confirm('Remove this evaluation?'))return;try{await api('deleteEvaluation',{idea,judge});await load();page('results')}catch(e){alert(e.message)}}
async function downloadResults(){try{const r=await api('exportResults');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.csv);a.download='Agent_Hunt_Results.csv';a.click()}catch(e){alert(e.message)}}
function renderJudge(){const d=state.data;document.getElementById('app').innerHTML=shell('Judge Dashboard',`Signed in as ${session.user}`,nav(state.page)+judgePage(d))}
function judgePage(d){if(state.page==='reviews')return judgeReviews(d);return `<div class="grid g3"><div class="stat"><div class="muted">Assigned Ideas</div><b>${d.ideas.length}</b></div><div class="stat"><div class="muted">Submitted</div><b>${d.results.length}</b></div><div class="stat"><div class="muted">Average</div><b>${d.results.length?Math.round(d.results.reduce((a,x)=>a+Number(x.total||0),0)/d.results.length):0}</b><span class="muted">/100</span></div></div><div style="height:16px"></div><div class="card"><h2>Review criteria</h2><p class="muted">Score each criterion within its maximum. Total is out of 100.</p><div class="grid g3">${CRITERIA.map(c=>`<div class="notice"><b>${c[0]} /${c[1]}</b><br><span class="small muted">${c[2]}</span></div>`).join('')}</div></div>`}
function judgeReviews(d){return `<div class="grid g2">${d.ideas.map(i=>{const ev=d.results.find(x=>x.idea===i.id);return `<div class="card"><div class="row"><div><span class="tag">${esc(i.id)}</span><h2>${esc(i.idea)}</h2><div class="muted">${esc(i.team)} · ${esc(i.leader)}</div></div>${ev?`<div class="score">${ev.total}/100</div>`:''}</div><div class="notice"><b>Business Impact:</b> ${esc(i.impact||'—')}<br><span class="small">${esc(i.description||'')}</span></div>${ev?`<div class="small muted">Submitted · edits used ${ev.edits||0}/2</div><div style="height:8px"></div><button class="btn ${Number(ev.edits||0)>=2?'':'primary'}" ${Number(ev.edits||0)>=2?'disabled':''} onclick='scoreForm(${JSON.stringify(i)},${JSON.stringify(ev)})'>${Number(ev.edits||0)>=2?'Locked':'Edit / View Marks'}</button>`:`<button class="btn primary" onclick='scoreForm(${JSON.stringify(i)},null)'>Start Review</button>`}</div>`}).join('')||'<div class="card empty">No ideas have been allocated to you.</div>'}</div>`}
function scoreForm(i,ev){const locked=ev&&Number(ev.edits||0)>=2;document.getElementById('app').innerHTML=shell(`Review: ${i.team}`,i.idea,nav('reviews')+`<div class="card"><div class="grid g2"><div><b>Team Leader</b><br>${esc(i.leader)}</div><div><b>Impact</b><br>${esc(i.impact||'—')}</div></div><div style="height:14px"></div>${CRITERIA.map((c,k)=>`<div class="criteria" style="margin:10px 0"><div><b>${k+1}. ${c[0]} /${c[1]}</b><div class="small muted">${c[2]}</div></div><input id="s${k}" type="number" min="0" max="${c[1]}" value="${ev?Number(ev['p'+(k+1)]):''}" ${locked?'disabled':''}></div>`).join('')}<div class="field" style="margin-top:14px"><label>Comments / Q&A Notes</label><textarea id="comments" ${locked?'disabled':''}>${esc(ev?.comments||'')}</textarea></div>${locked?msg('This evaluation is locked because the 2 allowed edits have been used.'):`<button class="btn primary" onclick='submitScore(${JSON.stringify(i)},${ev?JSON.stringify(ev):'null'})'>${ev?'Save Edit':'Submit Marks'}</button>`}<div id="smsg"></div></div>`)}
async function submitScore(i,ev){const p={idea:i.id,p1:$('#s0').value,p2:$('#s1').value,p3:$('#s2').value,p4:$('#s3').value,p5:$('#s4').value,comments:$('#comments').value};try{await api('saveEvaluation',p);await load();page('reviews')}catch(e){$('#smsg').innerHTML=msg(e.message,'err')}}
function page(p){state.page=p;render()}
function publicDashboard(){document.getElementById('app').innerHTML=`<div class="public"><div class="wrap"><div class="hero"><div class="ey">Agent Hunt · AI Challenge</div><h1>Review Dashboard</h1><p class="muted">Event dashboard</p></div><div id="pub" style="margin-top:16px" class="card">Loading…</div></div></div>`;api('public').then(r=>{const d=r.data;$('#pub').innerHTML=`<div class="grid g4"><div class="stat"><div class="muted">Ideas Submitted</div><b>${d.ideas}</b></div><div class="stat"><div class="muted">Teams Registered</div><b>${d.teams}</b></div><div class="stat"><div class="muted">Reviews Submitted</div><b>${d.reviews}</b></div><div class="stat"><div class="muted">Average Score</div><b>${d.average}</b><span class="muted">/100</span></div></div><div style="height:16px"></div><h2>Key Dates</h2><div class="grid g3"><div class="notice"><b>25 Sep 2026</b><br>Phase-1 Review</div><div class="notice"><b>30 Sep & 1 Oct 2026</b><br>POC submission & demo</div><div class="notice"><b>Judging Phase</b><br>Review & Q/A</div></div>`}).catch(e=>$('#pub').innerHTML=msg(e.message,'err'))}
if(new URLSearchParams(location.search).get('public')==='1')publicDashboard();else if(session)load();else login();
</script></body></html>
